# Credenciales de ejemplo, escritas aquí a propósito. En un proyecto real irían en un
# .env que no se sube a git.

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: persons
      MYSQL_USER: persons_user
      MYSQL_PASSWORD: 12345678
    volumes:
      - persons-data:/var/lib/mysql
      - ./backend/mysql:/docker-entrypoint-initdb.d:ro

    ports:
      - "127.0.0.1:3307:3306"

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ./backend/demo
      dockerfile: dockerfile

    environment:
      DB_URL: jdbc:mysql://mysql:3306/persons?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: persons_user
      DB_PASSWORD: 12345678

    ports:
      - "8090:8080"

    depends_on:
      mysql:
        condition: service_healthy

volumes:
  persons-data:
