spring.application.name=demo


# MySQL Datasource Configuration
# En Docker los valores llegan del environment de docker-compose.yml. Lo que va despues de ":" se usa fuera de Docker.
spring.datasource.url=${DB_URL:jdbc:mysql://192.168.1.228:3306/persons?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

logging.level.com.example.demo=INFO

spring.jackson.deserialization.fail-on-null-for-primitives=false